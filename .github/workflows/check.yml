name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Команда sv после npm link — в той оболочке, которая на этой ОС по умолчанию (на Windows это PowerShell).
      - name: npm link
        run: |
          npm link
          sv --help
      # Те же шаги, что в docs/kak-zapustit.md: команда запускается и новая папка игры читается.
      - name: smoke
        shell: bash
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          node bin/sv.mjs --help
          node bin/sv.mjs roster --dir examples/demo --today 2026-11-13 --no-color
          node bin/sv.mjs init "$RUNNER_TEMP/game" --yes --lead-name "Проверка" --person "anya:Аня:tech-lead" --camp "Бета"
          node bin/sv.mjs turn start --dir "$RUNNER_TEMP/game" --budget 5
          node bin/sv.mjs sheet anya --dir "$RUNNER_TEMP/game" --no-color
          node bin/sv.mjs turn end --dir "$RUNNER_TEMP/game"
          git -C "$RUNNER_TEMP/game" log --format=%s
      - name: web
        shell: bash
        run: |
          node bin/sv.mjs web --dir "$RUNNER_TEMP/game" --port 4199 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4199/api/state > state.json && break; sleep 1; done
          node -e "const s = JSON.parse(require('fs').readFileSync('state.json', 'utf8')); if (s.roster.length !== 2) throw new Error('roster'); console.log('state ok:', s.roster.map((r) => r.id).join(', '))"
          curl -fsS http://127.0.0.1:4199/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:4199/src/main.tsx > /dev/null
          echo "web ok"
