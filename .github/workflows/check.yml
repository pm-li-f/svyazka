name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Те же шаги, что в docs/kak-zapustit.md: команда запускается и новая папка игры читается.
      - name: smoke
        shell: bash
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          node bin/sv.mjs --help
          node bin/sv.mjs roster --dir examples/demo --today 2026-11-13 --no-color
          node bin/sv.mjs init "$RUNNER_TEMP/game" --yes --lead-name "Проверка" --person "anya:Аня:tech-lead" --camp "Бета"
          node bin/sv.mjs turn start --dir "$RUNNER_TEMP/game" --budget 5
          node bin/sv.mjs sheet anya --dir "$RUNNER_TEMP/game" --no-color
          node bin/sv.mjs turn end --dir "$RUNNER_TEMP/game"
          git -C "$RUNNER_TEMP/game" log --format=%s
