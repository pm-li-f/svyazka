name: manual

# Руководство игрока обновляется только по просьбе владельца, поэтому собирается вручную:
# вкладка Actions → manual → Run workflow. PDF появится в артефактах запуска.
on:
  workflow_dispatch:

jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run manual
      - uses: actions/upload-artifact@v4
        with:
          name: svyazka-manual
          path: docs/manual/out/svyazka-manual.pdf
          if-no-files-found: error
